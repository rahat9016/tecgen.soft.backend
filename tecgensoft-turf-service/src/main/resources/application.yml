spring:
  application:
    name: tecgensoft-turf-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tecgensoft_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${PORT:8081}
core:
  url: ${CORE_URL:http://localhost:8080}
  service-key: ${INTERNAL_SERVICE_KEY}
