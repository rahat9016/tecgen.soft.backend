spring:
  application:
    name: tecgensoft-turf-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tecgensoft_turf}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${PORT:8081}
core:
  url: ${CORE_URL:http://localhost:8080}
  service-key: ${INTERNAL_SERVICE_KEY}
turf:
  payment-window-minutes: ${TURF_PAYMENT_WINDOW_MINUTES:60}
  swagger:
    server-url: ${TURF_API_URL:http://localhost:8081}
