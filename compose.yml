name: tecgensoft
services:
  core-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tecgensoft_core
      POSTGRES_USER: tecgensoft
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["core_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecgensoft -d tecgensoft_core"]
      interval: 5s
      timeout: 5s
      retries: 20
  turf-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tecgensoft_turf
      POSTGRES_USER: tecgensoft
      POSTGRES_PASSWORD: ${TURF_DB_PASSWORD:?Set TURF_DB_PASSWORD}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["turf_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecgensoft -d tecgensoft_turf"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  tecgensoft-core-service:
    build: ./tecgensoft-core-service
    ports: ["8080:8080"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: local
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      DATABASE_URL: jdbc:postgresql://core-db:5432/tecgensoft_core
      DATABASE_USERNAME: tecgensoft
      DATABASE_PASSWORD: ${CORE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY}
      ORGANIZATION_ADMIN_EMAIL_DOMAIN: ${ORGANIZATION_ADMIN_EMAIL_DOMAIN:-legacy.local}
      ORGANIZATION_ADMIN_COMMON_PASSWORD: ${ORGANIZATION_ADMIN_COMMON_PASSWORD:?Set ORGANIZATION_ADMIN_COMMON_PASSWORD}
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: tecgensoft
      SUPER_ADMIN_BOOTSTRAP_ENABLED: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:-false}
      SUPER_ADMIN_FIRST_NAME: ${SUPER_ADMIN_FIRST_NAME:-Local}
      SUPER_ADMIN_LAST_NAME: ${SUPER_ADMIN_LAST_NAME:-Administrator}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@example.test}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
    depends_on:
      core-db: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: on-failure
  tecgensoft-turf-service:
    build: ./tecgensoft-turf-service
    ports: ["8081:8081"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://turf-db:5432/tecgensoft_turf
      DATABASE_USERNAME: tecgensoft
      DATABASE_PASSWORD: ${TURF_DB_PASSWORD}
      CORE_URL: http://tecgensoft-core-service:8080
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      turf-db: {condition: service_healthy}
      tecgensoft-core-service: {condition: service_started}
    restart: on-failure
volumes:
  core_data:
  turf_data:
  minio_data:
