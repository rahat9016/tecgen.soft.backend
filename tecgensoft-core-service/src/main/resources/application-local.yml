server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/tecgensoft_db
    username: postgres
    password: 9016
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  cache:
    type: none

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: familiemunshi-bucket
aws:
  s3:
    region: ${S3_REGION:eu-north-1}
    bucket-name: ${S3_BUCKET_NAME:familie-munshi-storage}
    public-base-url: ${S3_PUBLIC_BASE_URL:}

logging:
  level:
    root: INFO
    com.tecgensoft: DEBUG

springdoc:
  swagger-ui:
    urls:
      - name: Core Public APIs
        url: /v3/api-docs/public
      - name: Core Internal APIs
        url: /v3/api-docs/internal
      - name: Turf Public APIs
        url: http://localhost:8081/v3/api-docs/public
      - name: Turf Organization APIs
        url: http://localhost:8081/v3/api-docs/internal
