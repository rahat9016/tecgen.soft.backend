server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tecgensoft_db}
    username: ${DATABASE_USERNAME:tecgensoft}
    password: ${DATABASE_PASSWORD:${CORE_DB_PASSWORD:tecgensoft_local}}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  cache:
    type: none

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: familiemunshi-bucket

aws:
  s3:
    region: ${S3_REGION:eu-north-1}
    bucket-name: ${S3_BUCKET_NAME:familie-munshi-storage}
    public-base-url: ${S3_PUBLIC_BASE_URL:}

logging:
  level:
    root: INFO
    com.tecgensoft: DEBUG
